[package]
name = "rmcl"
version = "0.4.1"
authors = ["objz"]
edition = "2024"
description = "A fully featured Minecraft TUI launcher"
repository = "https://github.com/objz/rmcl"
homepage = "https://github.com/objz/rmcl"
license = "GPL-3.0-only"
readme = "README.md"
keywords = ["minecraft", "launcher", "tui", "ratatui"]
categories = ["command-line-utilities", "games"]

[package.metadata.wix]
upgrade-guid = "BEC08BE4-6A8F-4C1D-A1B4-B1AC963000AE"
path-guid = "E5863AC2-13FC-45C8-B79D-55338F371A8A"
include = ["pkg/wix/main.wxs"]
license = false
eula = false

[[bin]]
name = "rmcl"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4.39", features = ["serde"] }
clap = "4.5.27"
color-eyre = "0.6.3"
config = "0.15.6"
crossterm = "0.29.0"
display-info = "0.5.9"
dirs-next = "2.0.0"
log = "0.4"
ratatui = { version = "0.30.0", features = ["serde", "unstable-rendered-line-info"] }
ratatui-themekit = { version = "0.6", features = ["serde"] }
ratatui-textarea = { version = "0.9.1", features = ["crossterm"] }
tui-markdown = { version = "0.3.7", default-features = false }
pulldown-cmark = { version = "0.13.4", default-features = false }
html-to-markdown-rs = { version = "3.9.0", features = ["visitor"] }
resvg = "0.47"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
toml = "1.1.2"
toml_edit = "0.25"
tachyonfx = "0.25"
throbber-widgets-tui = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["full", "test-util"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-segmentation = "1"
tui-popup = "0.7"
tui-prompts = "0.6"
tui-logger = { version = "0.18", features = ["tracing-support"] }
tui-scrollview = "0.6"
tui-widget-list = "0.15"
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
zip = "8.5.1"
minecraft-msa-auth = "0.4.0"
oauth2 = "5.0.0"
open = "5"
which = "8.0.2"
dirs = "6.0.0"
notify = "8"
regex = "1"
fast-strip-ansi = "0.13"
libcasr = "2.13"
fs2 = "0.4"
fastnbt = "2.6.2"
flate2 = "1.1.9"


[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[profile.dist]
inherits = "release"
lto = "thin"

[dev-dependencies]
tempfile = "3"
insta = "1"
wiremock = "0.6"
rstest = "0.23"
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
